services:
  # Mini Redis 서버 (CDH 구현). `docker compose up -d` 로 띄운다.
  # AOF 는 named volume 에 저장되어 컨테이너를 지우고 다시 만들어도 데이터가 남는다.
  mini-redis:
    build:
      context: .
      target: runtime
    command: ["--bind", "0.0.0.0", "--port", "6379", "--aof", "/data/appendonly.aof"]
    init: true
    ports:
      - "127.0.0.1:${MINI_REDIS_PORT:-6379}:6379"
    volumes:
      - mini-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 2s

  # 개발 셸. profile 이 있어 `docker compose up` 에서는 뜨지 않고,
  # `docker compose run --rm dev ...` 처럼 이름을 지정하면 실행된다.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - .:/workspace

  # 동작 비교용 실제 Redis 8.
  #   docker compose --profile redis up -d --wait redis
  # dev 컨테이너에서는 서비스 이름으로 접속한다: redis-cli -h redis -p 6379
  redis:
    image: redis:8
    profiles: ["redis"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"

volumes:
  mini-redis-data:
